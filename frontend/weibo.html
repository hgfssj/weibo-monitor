<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 大V / 行业监控看板</title>
<style>
  :root {
    /* 雪球风：白底 + 蓝主色 */
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #ebedf0;
    --text: #1d2129;
    --muted: #8a94a6;
    --accent: #1e8fff;          /* 主蓝 */
    --accent-hover: #1773e6;
    --accent-soft: #e8f1ff;
    --up: #f0413e;              /* 涨 / 看多 = 红 */
    --down: #00a854;            /* 跌 / 看空 = 绿 */
    --new-glow: rgba(30,143,255,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ===== 顶部应用栏（雪球风：白底 + 细底边 + 吸顶） ===== */
  .app-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .app-bar-inner {
    max-width: 1040px; margin: 0 auto; height: 58px;
    padding: 0 20px; display: flex; align-items: center; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #4ba6ff);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 2px 8px rgba(30,143,255,.35);
  }
  .brand-name { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .brand-sub { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }

  /* 顶层：分段控件（大V / 行业） */
  .topnav { display: inline-flex; background: #f0f2f5; border-radius: 10px; padding: 3px; gap: 2px; }
  .topnav-btn {
    border: none; background: transparent; cursor: pointer; font-family: inherit;
    padding: 7px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #5a6573;
    transition: all .2s ease;
  }
  .topnav-btn:hover { color: var(--accent); }
  .topnav-btn.active { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.10); }

  .meta { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .meta #updated-at { font-weight: 600; color: #5a6573; }
  .badge-new {
    display: inline-block; background: var(--up); color: #fff;
    font-weight: 700; border-radius: 10px; padding: 1px 9px; font-size: 12px; margin-top: 2px;
  }

  /* ===== 内容容器 ===== */
  #content { max-width: 1040px; margin: 0 auto; padding: 20px; min-height: 60vh; }
  .empty { color: var(--muted); text-align: center; padding: 70px 0; }
  #loading { color: var(--muted); text-align: center; padding: 70px 0; }

  /* ===== 子级 Tab（下划线风格） ===== */
  .tab-bar { display: flex; gap: 2px; flex-wrap: wrap; }
  .industry-bar, .platform-bar { gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
  .sub-tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 10px 16px; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 500; white-space: nowrap; transition: all .2s ease;
  }
  .sub-tab:hover { color: var(--accent); }
  .sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

  /* ===== 通用徽章 ===== */
  .summary-badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 2px 9px; margin-right: 6px; line-height: 1.5; }
  .b-red    { background: #fdeceb; color: var(--up); }
  .b-green  { background: #e7f7ee; color: var(--down); }
  .b-blue   { background: var(--accent-soft); color: var(--accent); }
  .b-orange { background: #fff3e0; color: #f5a623; }
  .b-gray   { background: #f0f2f5; color: var(--muted); }
  .b-bull   { background: #fdeceb; color: var(--up); }
  .b-bear   { background: #e7f7ee; color: var(--down); }
  .b-neutral{ background: #f0f2f5; color: var(--muted); }
  .b-high   { background: #fff3e0; color: #f5a623; }
  .b-medium { background: var(--accent-soft); color: var(--accent); }
  .b-low    { background: var(--accent-soft); color: var(--accent); }
  .b-empty  { background: #f0f2f5; color: var(--muted); }
  .b-add    { background: #fdeceb; color: var(--up); }
  .b-reduce { background: #e7f7ee; color: var(--down); }
  .b-hold   { background: var(--accent-soft); color: var(--accent); }
  .b-unknown{ background: #f0f2f5; color: var(--muted); }

  /* ===== 区段标题（左侧蓝条） ===== */
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 800; color: var(--text);
    margin: 24px 0 14px;
  }
  .section-label::before { content: ""; width: 4px; height: 15px; background: var(--accent); border-radius: 2px; }

  /* ===== 大V观点总结卡片 / 行业研判卡片（蓝色 hero 卡） ===== */
  .summary-card, .industry-card {
    background: linear-gradient(180deg, #f4f9ff, #ffffff);
    border: 1px solid #d6e6ff; border-radius: 16px; padding: 18px; margin-bottom: 18px;
    box-shadow: 0 2px 12px rgba(30,143,255,.07);
    animation: fadeIn .3s ease both;
  }
  .summary-title { font-size: 15px; font-weight: 800; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-item { background: #fafbfc; border: 1px solid #eef1f5; border-radius: 10px; padding: 12px 14px; }
  .summary-item .label { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .summary-item .body { font-size: 13.5px; line-height: 1.65; color: #323a47; }
  .holdings-list { margin: 0; padding-left: 16px; }
  .holdings-list li { font-size: 13px; line-height: 1.6; margin-bottom: 3px; }
  .summary-foot { margin-top: 14px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
  .conf-high { color: var(--down); font-weight: 800; }
  .conf-medium { color: #f5a623; font-weight: 800; }
  .conf-low { color: var(--up); font-weight: 800; }

  /* ===== 大V面板 ===== */
  .user-section { margin-bottom: 30px; }
  .user-header {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .user-header img { width: 52px; height: 52px; border-radius: 50%; background: #eef1f5; object-fit: cover; }
  .user-name { font-size: 18px; font-weight: 800; }
  .user-name a { color: var(--text); text-decoration: none; }
  .user-name a:hover { color: var(--accent); }
  .verified { color: var(--accent); font-size: 12px; margin-left: 6px; }
  .user-desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .followers { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .mode-tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
  .mode-filter { background: var(--accent-soft); color: var(--accent); }
  .mode-all { background: #e7f7ee; color: var(--down); }

  /* ===== 帖子卡片 ===== */
  .post {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    transition: border-color .25s, box-shadow .2s, transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
    animation: fadeIn .3s ease both;
  }
  .post:hover { box-shadow: 0 3px 14px rgba(0,0,0,.07); border-color: #dbe3ec; }
  .post.is-new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px var(--new-glow); }
  .post-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .post-time { color: var(--muted); font-size: 12px; }
  .new-tag { color: var(--accent); font-size: 12px; font-weight: 800; }
  .comment-tag { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; border-radius: 10px; padding: 1px 8px; margin-right: 6px; }
  .post-text { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .retweet { margin-top: 8px; padding: 9px 12px; background: #f7f8fa; border-left: 3px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .pics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pics img { max-width: 160px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .post-stats { margin-top: 10px; color: var(--muted); font-size: 12px; display: flex; gap: 18px; align-items: center; }
  .post-link { color: var(--muted); text-decoration: none; }
  .post-link:hover { color: var(--accent); }

  /* ===== 行业：股票池卡片 ===== */
  .stock-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 640px) { .stock-list { grid-template-columns: 1fr; } }
  .stock-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; position: relative;
    transition: border-color .2s, box-shadow .2s, transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
  }
  .stock-item:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(30,143,255,.14); transform: translateY(-2px); }
  .stock-item::after { content: "讨论 ↓"; position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .2s; }
  .stock-item:hover::after { opacity: .9; }
  .stock-name { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .stock-code { font-size: 11px; color: var(--muted); font-weight: 500; }
  .stock-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .stock-quote { font-size: 14px; font-weight: 800; margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  .stock-quote.pos { color: var(--up); }
  .stock-quote.neg { color: var(--down); }
  .stock-quote .posts { color: var(--muted); font-weight: 500; font-size: 12px; }

  /* ===== 行业：可折叠个股讨论 ===== */
  .stock-disc { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; background: var(--card); transition: box-shadow .2s; animation: fadeIn .3s ease both; }
  .stock-disc:hover { box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  .stock-disc-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; background: #fafbfc; cursor: pointer; font-size: 14.5px; font-weight: 700; color: var(--text); transition: background .2s; }
  .stock-disc-head:hover { background: #f0f6ff; }
  .disc-toggle { font-size: 16px; color: var(--muted); font-weight: 400; transition: transform .25s ease; display: inline-block; }
  .disc-toggle.rot { transform: rotate(180deg); }
  .stock-disc-body { padding: 4px 16px 14px; }
  .hidden { display: none; }

  /* ===== 行业：有价值观点 + 综合点评 ===== */
  .valuable-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    animation: fadeIn .3s ease both;
  }
  .comment-item { background: #f7f8fa; border-left: 3px solid var(--border); border-radius: 6px; padding: 9px 12px; margin-top: 8px; font-size: 13px; line-height: 1.65; }
  .comment-item .ca { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .commentary { margin-top: 12px; padding: 12px 14px; background: #f0f6ff; border-left: 3px solid var(--accent); border-radius: 8px; font-size: 13.5px; line-height: 1.75; color: #2a3b52; }
  .commentary b { color: var(--accent); }
  .vp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .vp-stock { font-size: 14px; font-weight: 800; color: #1f3a5f; background: #eef4ff; border: 1px solid #d6e4ff; border-radius: 8px; padding: 3px 10px; white-space: nowrap; }
  .vp-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .vp-meta .vp-author { font-weight: 700; color: #34495e; }
  .vp-meta .vp-time { color: var(--accent); font-weight: 700; }
  .valuable-card .post-link { display: inline-block; font-weight: 700; color: var(--accent); background: #eef4ff; border: 1px solid #cfe0ff; border-radius: 8px; padding: 4px 12px; text-decoration: none; transition: background .15s, color .15s; white-space: nowrap; }
  .valuable-card .post-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  /* ===== 配置管理页 ===== */
  .cfg-wrap { max-width: 940px; margin: 0 auto; }
  .cfg-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; animation: fadeIn .3s ease both; }
  .cfg-grid { display: grid; grid-template-columns: 1fr 170px; gap: 12px 16px; align-items: center; }
  .cfg-grid label { font-size: 13px; color: #4a5568; font-weight: 600; }
  .cfg-input, .cfg-row input, .cfg-row select, .stock-tbl input, .stock-tbl select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 13px; background: #fff; color: var(--text);
  }
  .cfg-input:focus, .cfg-row input:focus, .stock-tbl input:focus, .cfg-row select:focus, .stock-tbl select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--new-glow);
  }
  .cfg-tip { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.7; background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; }
  .cfg-tip code { background: #fff; border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 12px; }
  .cfg-row { display: grid; grid-template-columns: 108px 1fr 1fr 34px 34px 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cfg-row-head { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .mini-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; cursor: pointer; height: 34px; color: #5a6573; font-size: 13px; transition: all .15s; }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .mini-btn.del:hover { border-color: var(--up); color: var(--up); }
  .ind-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; background: #fcfdff; }
  .ind-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ind-card-head .ind-name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .ind-card-head .stock-count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .stock-tbl { width: 100%; }
  .st-row { display: grid; grid-template-columns: 1.5fr 1fr 1.2fr 32px 32px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .btn-add { display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; margin-top: 6px; transition: all .15s; }
  .btn-add:hover { background: #d8e9ff; }
  .cfg-savebar { position: sticky; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-top: 6px; box-shadow: 0 -2px 14px rgba(0,0,0,.05); }
  .cfg-msg { flex: 1; font-size: 13px; line-height: 1.5; }
  .cfg-msg.ok { color: var(--accent); }
  .cfg-msg.err { color: var(--up); }
  .btn-save { background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 10px 22px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(30,143,255,.3); transition: background .15s; }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-save:disabled { opacity: .6; cursor: default; }

  /* ===== 股指期货 ===== */
  .if-wrap { max-width: 980px; margin: 0 auto; }
  .if-intro { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; font-size: 13.5px; line-height: 1.75; color: #46505f; }
  .if-intro a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .if-intro a:hover { text-decoration: underline; }
  .if-intro code { background: #f0f2f5; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  .if-form { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .if-form .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
  .if-form .fld { display: flex; flex-direction: column; gap: 5px; }
  .if-form label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .if-form input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; background: #fff; color: var(--text); }
  .if-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--new-glow); }
  .if-inst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 6px 0 12px; }
  .if-inst { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #fafbfc; }
  .if-inst .inst-name { font-weight: 700; font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .if-inst .inst-name .del { cursor: pointer; color: var(--up); font-size: 12px; border: none; background: none; font-family: inherit; }
  .if-inst .lr { display: flex; gap: 8px; }
  .if-inst .lr input { width: 100%; }
  .if-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .if-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .if-table th, .if-table td { padding: 9px 11px; text-align: right; font-size: 12.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .if-table th { background: #f5f7fa; color: var(--muted); font-weight: 700; }
  .if-table th:first-child, .if-table td:first-child { text-align: left; }
  .if-table tr:hover { background: #f8fbff; }
  .if-table .grp { background: #eef4ff; color: var(--accent); font-weight: 700; text-align: center; }
  .if-net-pos { color: var(--up); font-weight: 700; }
  .if-net-neg { color: var(--down); font-weight: 700; }
  .if-delta-pos { color: var(--up); }
  .if-delta-neg { color: var(--down); }
  .if-tbl-link { color: var(--accent); text-decoration: none; font-size: 12px; }
  .if-tbl-link:hover { text-decoration: underline; }
  .if-chart-card, .if-analysis { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .if-chart-card svg { width: 100%; height: auto; display: block; }
  .if-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .if-legend span i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .if-analysis .ana-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #fafbfc; line-height: 1.8; }
  .if-analysis .ana-item .t { font-weight: 800; margin-bottom: 4px; font-size: 14px; }
  .if-feed-search { width: 260px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; }
  .if-feed-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--new-glow); }

  /* ===== A股资金面 ===== */
  .macro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .macro-grid { grid-template-columns: 1fr; } }
  .macro-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .macro-card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .macro-card-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .macro-card-latest { font-size: 12px; color: var(--muted); }
  .macro-card-latest b { font-size: 16px; color: var(--text); margin-left: 6px; }
  .macro-card-unit { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .macro-chart { margin-top: 8px; }
  .macro-chart svg { width: 100%; height: auto; display: block; }
  .macro-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .macro-legend span i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  /* 国家队宽基ETF板块 */
  .ntf-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .ntf-toggle { margin: 4px 0 2px; display: flex; gap: 8px; }
  .ntf-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  .ntf-table th, .ntf-table td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .ntf-table th { color: var(--muted); font-weight: 600; }
  .ntf-table td.pos { color: #00a854; font-weight: 600; }
  .ntf-table td.neg { color: #f0413e; font-weight: 600; }
  .mini-btn { cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); user-select: none; }
  .mini-btn.active { background: var(--accent, #1e8fff); color: #fff; border-color: var(--accent, #1e8fff); }
  .macro-intro { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 18px; }

</style>
</head>
<body>
<header class="app-bar">
  <div class="app-bar-inner">
    <div class="brand">
      <span class="logo">📈</span>
      <span class="brand-name">监控看板</span>
      <span class="brand-sub">大V · 行业 · 期指 · 资金面</span>
    </div>
    <nav class="topnav">
      <button id="tab-bigv" class="topnav-btn active" onclick="switchMode('bigv')">📡 大V监控</button>
      <button id="tab-industry" class="topnav-btn" onclick="switchMode('industry')">🏭 行业监控</button>
      <button id="tab-ifutures" class="topnav-btn" onclick="switchMode('ifutures')">📊 股指期货</button>
      <button id="tab-macro" class="topnav-btn" onclick="switchMode('macro')">💰 A股资金面</button>
      <button id="tab-config" class="topnav-btn" onclick="switchMode('config')">⚙️ 配置管理</button>
    </nav>
    <div class="meta">
      <div id="updated-at">加载中…</div>
      <div id="poll-hint">每 30 秒自动刷新</div>
      <div id="new-badge"></div>
    </div>
  </div>
</header>
<span id="page-title" class="sr-only">大V监控</span>
<div id="loading">正在加载数据，请先运行 <code>python weibo_monitor.py</code></div>
<div id="content"></div>

<script>
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).replace(" ", "T"));
  if (isNaN(d)) return iso;
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(s) {
  const div = document.createElement("div");
  div.textContent = s || "";
  return div.innerHTML;
}
function fmtNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + "万";
  return String(n || 0);
}
const PLATFORMS = {
  weibo:  { label: "微博", icon: "🔴" },
  xueqiu: { label: "雪球", icon: "🔵" },
};

// ============================ 全局状态 ============================
let MODE = "bigv";                 // 顶层：bigv | industry | config | macro
let ntfData = null;                // 国家队ETF数据（A股资金面板块）
let ntfMode = "net";               // 国家队ETF视图：net(每日净申购金额) | level(持仓金额)
let turnoverData = null;           // 行业成交额占比数据（A股资金面板块）
let itRange = 90;                  // 行业占比图显示范围（交易日）
let itSelected = new Set();        // 行业占比图选中的行业 key
let itInited = false;
let idxTrendData = null;           // 主要指数走势数据（A股资金面板块）
let idxRange = 63;                 // 指数走势图显示范围（交易日：63/126/250）
let idxSelected = new Set();       // 指数走势图选中的指数 key
let idxInited = false;
let intradayData = null;           // 盘中实时数据（/api/intraday）
let intraSelected = new Set();
let intraInited = false;
let intradayTimer = null;
let activePlatform = "weibo";      // 大V：一级 Tab
let activeUid = {};                // 大V：每个平台各自记住选中的大V
let activeIndustry = null;         // 行业：选中的方向
let lastBigv = null, lastInd = null, lastMacro = null;
let cfgEdit = null;                // 配置管理：可编辑的配置副本
let pollIntervalSec = 30;          // 前台轮询间隔（秒），来自配置
let pollTimer = null;              // 轮询定时器

// 股指期货
let lastIF = null;                 // {institutions, records, feed}
let ifFormRecord = { positions: {} };  // 录入表单当前值
let ifFormEditing = null;          // 正在编辑的记录日期（null=新增）
const IF_COLORS = ["#1e8fff", "#f0413e", "#00a854", "#f5a623", "#8a5cf6"];

// ============================ 徽章（多空红绿：看多/涨=红，看空/跌=绿） ============================
function stanceBadge(s) {
  const m = { bullish: ["看多", "b-bull"], bearish: ["看空", "b-bear"], neutral: ["中性", "b-neutral"] };
  const v = m[s] || ["未知", "b-neutral"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
function levelBadge(l) {
  const m = { high: ["高仓位", "b-high"], medium: ["中等", "b-medium"], low: ["低仓位", "b-low"], empty: ["空仓", "b-empty"] };
  const v = m[l] || ["未知", "b-unknown"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
function actionBadge(a) {
  const m = { add: ["加仓", "b-add"], reduce: ["减仓", "b-reduce"], hold: ["维持", "b-hold"], unknown: ["不明", "b-unknown"] };
  const v = m[a] || ["不明", "b-unknown"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
// 行业研判徽章
function trendBadge(d) {
  const m = { upward: ["景气度上行", "b-red"], downward: ["景气度下行", "b-green"],
              volatile: ["震荡", "b-gray"], rotating: ["主题轮动", "b-orange"], neutral: ["中性", "b-gray"] };
  const v = m[d] || ["中性", "b-gray"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
function valBadge(l) {
  const m = { cheap: ["估值偏低", "b-blue"], fair: ["估值合理", "b-blue"],
              expensive: ["估值偏贵", "b-orange"], uncertain: ["难判断", "b-gray"] };
  const v = m[l] || ["难判断", "b-gray"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
function sentBadge(s) {
  const m = { bullish: ["偏看多", "b-red"], bearish: ["偏看空", "b-green"],
              neutral: ["中性", "b-gray"], divided: ["分歧大", "b-orange"] };
  const v = m[s] || ["中性", "b-gray"];
  return `<span class="summary-badge ${v[1]}">${v[0]}</span>`;
}
function srcLabel(src) {
  if (src === "seed-manual") return "初始研判(人工·通用)";
  if (src === "seed") return "初始推断(人工)";
  if (src === "llm") return "大模型推断";
  return "启发式";
}

// ============================ 大V总结卡片 ============================
function renderSummary(s) {
  if (!s) {
    return `<div class="summary-card" style="opacity:.8">
      <div class="summary-title">🧭 当前观点总结（基于近期发言推断）</div>
      <div class="summary-foot">尚未生成 — 配置 DASHSCOPE_API_KEY 后由大模型自动推断（详见 weibo_summary.py）</div>
    </div>`;
  }
  const mv = s.market_view || {};
  const pl = s.position_level || {};
  const ar = s.add_reduce || {};
  const holdings = (s.holdings || []).map(h => `<li><b>${esc(h.name)}</b>：${esc(h.analysis || "")}</li>`).join("");
  const conf = s.confidence || "low";
  const src = srcLabel(s.source);
  return `<div class="summary-card">
    <div class="summary-title">🧭 当前观点总结（基于近期发言推断）</div>
    <div class="summary-grid">
      <div class="summary-item"><div class="label">行情多空观点</div><div class="body">${stanceBadge(mv.stance)}${esc(mv.text || "")}</div></div>
      <div class="summary-item"><div class="label">仓位水位</div><div class="body">${levelBadge(pl.level)}${esc(pl.text || "")}</div></div>
      <div class="summary-item"><div class="label">加减仓情况</div><div class="body">${actionBadge(ar.action)}${esc(ar.text || "")}</div></div>
      <div class="summary-item"><div class="label">可能持有个股/板块</div><div class="body">${holdings ? `<ul class="holdings-list">${holdings}</ul>` : '<span class="body">未明确披露</span>'}</div></div>
    </div>
    <div class="summary-foot">推断来源：${src} · 置信度：<span class="conf-${conf}">${conf}</span>${s.generated_at ? " · " + fmtTime(s.generated_at) : ""}</div>
  </div>`;
}

// ============================ 大V单个面板 ============================
function renderUser(u) {
  let html = `<div class="user-section">
      <div class="user-header">
        ${u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : ""}
        <div>
          <div class="user-name">
            <a href="${esc(u.profile_url)}" target="_blank">@${esc(u.name)}</a>
            ${u.verified ? `<span class="verified">✔ ${esc(u.verified)}</span>` : ""}
            ${u.filter ? '<span class="mode-tag mode-filter">仅股市相关（含隐喻识别）</span>'
                         : '<span class="mode-tag mode-all">全量展示·不过滤</span>'}
          </div>
          ${u.description ? `<div class="user-desc">${esc(u.description)}</div>` : ""}
          <div class="followers">粉丝 ${fmtNum(u.followers)} · 展示 ${u.posts ? u.posts.length : 0} 条${u.filter && u.filtered_count ? ` · 已过滤 ${u.filtered_count} 条无关` : ""}</div>
        </div>
      </div>`;
  html += renderSummary(u.summary);
  if (!u.posts || u.posts.length === 0) {
    html += `<div class="empty">${u.filter ? "暂无股市相关发言" : "暂无发言"}</div>`;
  } else {
    for (const p of u.posts) {
      const isComment = p.type === "comment";
      html += `<div class="post ${p.is_new ? "is-new" : ""}">
          <div class="post-top">
            <span class="post-time">${isComment ? '<span class="comment-tag">💬 评论</span>' : ""}${fmtTime(p.created_at)}${p.source ? " · " + esc(p.source) : ""}</span>
            ${p.is_new ? '<span class="new-tag">🆕 新发言</span>' : ""}
          </div>
          <div class="post-text">${esc(p.text)}</div>
          ${isComment ? `<div class="retweet">↳ ${p.reply_to ? `回复粉丝 @${esc(p.reply_to_user || "")}：「${esc(p.reply_to)}」` : `评论于原微博：${esc(p.original_post || "")}`} <a class="post-link" href="${esc(p.original_url)}" target="_blank">查看→</a></div>` : ""}
          ${p.is_retweet && p.retweet_text ? `<div class="retweet">↪ ${esc(p.retweet_text)}</div>` : ""}
          ${p.pics && p.pics.length ? `<div class="pics">${p.pics.map(x => `<a href="${esc(x)}" target="_blank"><img src="${esc(x)}" loading="lazy"></a>`).join("")}</div>` : ""}
          <div class="post-stats">
            <span>🔁 ${fmtNum(p.reposts)}</span>
            <span>💬 ${fmtNum(p.comments)}</span>
            <span>❤️ ${fmtNum(p.likes)}</span>
            <a class="post-link" href="${esc(p.url)}" target="_blank">原文链接 →</a>
          </div>
        </div>`;
    }
  }
  html += `</div>`;
  return html;
}

// ============================ 大V视图（平台 + 大V 两级 Tab） ============================
function renderBigv(data) {
  const root = document.getElementById("content");
  const platforms = data.platforms || {};
  const avail = Object.keys(PLATFORMS).filter(k => (platforms[k] || []).length);
  if (!avail.length) {
    root.innerHTML = '<div class="empty">暂无监控账号</div>';
    return;
  }
  if (!avail.includes(activePlatform)) activePlatform = avail[0];
  let html = '<div class="tab-bar platform-bar">';
  for (const k of avail) {
    html += `<button class="sub-tab ${k === activePlatform ? "active" : ""}" onclick="switchPlatform('${k}')">${PLATFORMS[k].icon} ${PLATFORMS[k].label} · ${platforms[k].length} 人</button>`;
  }
  html += '</div>';

  const users = platforms[activePlatform];
  if (!activeUid[activePlatform] || !users.some(u => u.uid === activeUid[activePlatform])) {
    activeUid[activePlatform] = users[0].uid;
  }
  html += '<div class="tab-bar">';
  for (const u of users) {
    html += `<button class="sub-tab ${u.uid === activeUid[activePlatform] ? "active" : ""}" onclick="switchUser('${u.uid}')">${esc(u.name)}</button>`;
  }
  html += '</div>';

  html += renderUser(users.find(u => u.uid === activeUid[activePlatform]));
  root.innerHTML = html;
}

// ============================ 行业视图 ============================
function renderIndustryPost(p, stockName) {
  return `<div class="post ${p.is_new ? "is-new" : ""}">
    <div class="post-top">
      <span class="post-time">${fmtTime(p.created_at)} · @${esc(p.author || "")} · ${esc(stockName || "")}</span>
      ${p.is_new ? '<span class="new-tag">🆕 新</span>' : ""}
    </div>
    <div class="post-text">${esc(p.text || "")}</div>
    <div class="post-stats">
      <span>💬 ${fmtNum(p.comments)}</span>
      <span>❤️ ${fmtNum(p.likes)}</span>
      <a class="post-link" href="${esc(p.url)}" target="_blank">原文→</a>
    </div>
  </div>`;
}

function toggleStock(sym) {
  const bd = document.getElementById("bd-" + sym);
  const tg = document.getElementById("tg-" + sym);
  if (!bd) return;
  const hidden = bd.classList.toggle("hidden");
  if (tg) { tg.textContent = "⌄"; tg.classList.toggle("rot", !hidden); }
}
function scrollToStock(sym) {
  const el = document.getElementById("stock-" + sym);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderIndustry(data) {
  const root = document.getElementById("content");
  const inds = data.industries || {};
  const ids = Object.keys(inds);
  if (!ids.length) {
    root.innerHTML = '<div class="empty">暂无行业数据</div>';
    return;
  }
  if (!activeIndustry || !inds[activeIndustry]) activeIndustry = ids[0];

  let html = '<div class="tab-bar industry-bar">';
  for (const id of ids) {
    html += `<button class="sub-tab ${id === activeIndustry ? "active" : ""}" onclick="switchIndustry('${id}')">${inds[id].icon || ""} ${esc(inds[id].name)}</button>`;
  }
  html += '</div>';

  const ind = inds[activeIndustry];
  const s = ind.summary || {};
  const trend = s.trend || {}, val = s.valuation || {}, sent = s.sentiment || {};
  const kps = s.key_points || [];
  const days = ind.days || 7;

  // 研判卡片
  html += `<div class="industry-card">
    <div class="summary-title">🔭 ${esc(ind.name)} · 近 ${days} 天趋势与估值研判</div>
    <div class="summary-grid">
      <div class="summary-item"><div class="label">趋势发展研判</div><div class="body">${trendBadge(trend.direction)}${esc(trend.text || "")}</div></div>
      <div class="summary-item"><div class="label">估值潜力判断</div><div class="body">${valBadge(val.level)}${esc(val.text || "")}</div></div>
      <div class="summary-item"><div class="label">多空共识</div><div class="body">${sentBadge(sent.stance)}${esc(sent.text || "")}</div></div>
      <div class="summary-item"><div class="label">关键要点</div><div class="body">${kps.length ? kps.map(k => `<div>· ${esc(k)}</div>`).join("") : "—"}</div></div>
    </div>
    <div class="summary-foot">推断来源：${srcLabel(s.source)} · 置信度：<span class="conf-${s.confidence || 'low'}">${s.confidence || 'low'}</span>${s.generated_at ? " · " + fmtTime(s.generated_at) : ""} · 数据窗口：近 ${days} 天雪球讨论</div>
  </div>`;

  // 股票池（行情）
  const stocks = ind.stocks || [];
  if (stocks.length) {
    html += `<div class="section-label">股票池（雪球 · 近 ${days} 天讨论 ${(ind.posts_count || 0)} 条，点击卡片定位讨论）</div>`;
    html += '<div class="stock-list">';
    for (const st of stocks) {
      const q = st.quote || {};
      const chg = q.change_pct;
      const chgCls = (chg == null) ? "" : (chg >= 0 ? "pos" : "neg");
      const chgStr = (chg == null) ? "" : ((chg >= 0 ? "+" : "") + chg + "%");
      const ss = (st.summary && st.summary.sentiment && st.summary.sentiment.stance) || "neutral";
      const nPosts = (st.posts || []).length;
      html += `<div class="stock-item" onclick="scrollToStock('${esc(st.symbol)}')">
        <div class="stock-name">${esc(st.name)} <span class="stock-code">${esc(st.symbol)}</span> ${sentBadge(ss)}</div>
        <div class="stock-note">${esc(st.note || "")}</div>
        ${q.price != null ? `<div class="stock-quote ${chgCls}"><span>${q.price}</span><span>${chgStr}</span><span class="posts">· ${nPosts} 条讨论</span></div>` : `<div class="stock-quote"><span class="posts">行情缺失 · ${nPosts} 条讨论</span></div>`}
      </div>`;
    }
    html += '</div>';
  }

  // 有价值的观点 + 综合点评（近 3 天，置于个股讨论之前）
  const vps = ind.valuable_viewpoints || [];
  html += `<div class="section-label">💡 有价值的观点 + 综合点评（近 3 天 · ${vps.length} 条，按互动量排序）</div>`;
  if (!vps.length) {
    html += '<div class="empty">近 3 天暂无值得列出的观点</div>';
  } else {
    for (const v of vps) {
      const post = v.post || {};
      const comments = v.comments || [];
      const reply = v.reply_count || post.comments || 0;
      const stockName = post.stock_name
        || (post.source ? String(post.source).replace("雪球·", "") : "");
      html += `<div class="valuable-card">
        <div class="vp-head">
          <span class="vp-stock">🏷️ ${esc(stockName || "雪球")}</span>
          <a class="post-link" href="${esc(post.url)}" target="_blank" rel="noopener">在雪球查看原文 →</a>
        </div>
        <div class="vp-meta">
          <span class="vp-author">@${esc(post.author || "雪球用户")}</span>
          <span class="vp-time">🕒 ${esc(fmtTime(post.created_at))}</span>
        </div>
        <div class="post-text">${esc(post.text || "")}</div>
        <div class="post-stats"><span>🔁 ${fmtNum(post.reposts)}</span><span>💬 ${fmtNum(reply)}</span><span>❤️ ${fmtNum(post.likes)}</span></div>
        ${comments.length ? `<div style="font-size:12px;color:var(--muted);margin-top:8px;font-weight:700">精彩评论（${comments.length}）</div>` + comments.map(c => `<div class="comment-item"><span class="ca">@${esc(c.author || "")}</span>${esc(c.text || "")} <span style="color:var(--muted)">❤️${fmtNum(c.likes)}</span></div>`).join("") : '<div style="font-size:12px;color:var(--muted);margin-top:8px">（暂无精彩评论样本·雪球评论完整列表受反爬限制，仅取精彩评论）</div>'}
        <div class="commentary"><b>📝 综合点评：</b>${esc(v.commentary || "")}</div>
      </div>`;
    }
  }

  // 个股讨论（可折叠，默认展开第一只）
  if (stocks.length) {
    html += `<div class="section-label">📊 个股近期讨论（近 ${days} 天，点击展开/收起）</div>`;
    stocks.forEach((st, idx) => {
      const posts = (st.posts || []).slice()
        .sort((a, b) => ((b.likes || 0) + (b.comments || 0) * 3) - ((a.likes || 0) + (a.comments || 0) * 3))
        .slice(0, 10);
      const ss = (st.summary && st.summary.sentiment && st.summary.sentiment.stance) || "neutral";
      const open = idx === 0;
      html += `<div class="stock-disc" id="stock-${esc(st.symbol)}">
        <div class="stock-disc-head" onclick="toggleStock('${esc(st.symbol)}')">
          <span>${esc(st.name)} <span class="stock-code">${esc(st.symbol)}</span> · ${posts.length} 帖 ${sentBadge(ss)}</span>

// 从 positions 计算净持仓（手动录入）
function ifPositionNet(p) {
  if (p && p.long != null && p.short != null) return p.long - p.short;
  return null;
}
// 取某机构在某日的净空单水平（真实绝对水平，来自中金所公开数据）：优先 net_short_cumulative，其次 positions 手算
function ifInstNet(r, inst) {
  const c = (r.net_short_cumulative || {})[inst];
  if (c != null) return c;
  return ifPositionNet((r.positions || {})[inst]);
}
// 取某机构在某日的净空单变化量：优先 net_short_change，其次由相邻记录水平差分
function ifInstChange(r, inst, prevNet) {
  const ch = (r.net_short_change || {})[inst];
  if (ch != null) return ch;
  const net = ifInstNet(r, inst);
  if (net != null && prevNet != null) return net - prevNet;
  return null;
}
// 兼容 pics 两种存储格式：['url1,url2'] 或 ['url1','url2']
function ifExtractPics(post) {
  const raw = post.pics || [];
  const out = [];
  for (const item of (Array.isArray(raw) ? raw : [raw])) {
    for (const u of String(item).split(",")) {
      const s = u.trim();
      if (s.startsWith("http")) out.push(s);
    }
  }
  return out;
}

function ymd(d) {

function ifShFromFeed() {
  // 从已采集的大V原文中提取「上证指数 收报 XXXX.XX 点」真实收盘值，按日期建表
  const map = {};

      const m = (p.text || "").match(/上证指数[^。；]{0,40}?([0-9]{4,5}\.[0-9]{2})\s*点/);
      if (m) { const d = (p.created_at || "").slice(0, 10); if (d) map[d] = parseFloat(m[1]); }
    }

}
async function ifAutoFill30() {
  if (!confirm("自动填充最近 30 个交易日（用于快速预览三条趋势线）：\n\n· 上证指数：优先取大V原文中的真实收盘值，缺口用插值估算\n· 中信 / 其他机构『总空单』：示例模板（请按大V原文图片替换为真实值）\n\n是否继续？")) return;
  const insts = lastIF.institutions.length ? lastIF.institutions : ["中信期货", "其他大机构"];
  lastIF.institutions = insts;
  // 确保大V原文已加载，避免时序问题导致取不到真实上证
  if (!lastIF.feed) {
    try {
      const r = await fetch("data/if_posts.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) lastIF.feed = await r.json();
    } catch (e) {}
  }
  const shMap = ifShFromFeed();

  // 生成最近 30 个交易日（跳过周末），截至今天
  const days = [];
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let guard = 0;
  while (days.length < 30 && guard < 120) {
    const dow = t.getDay();
    if (dow !== 0 && dow !== 6) days.unshift(ymd(t));
    t.setDate(t.getDate() - 1); guard++;
  }
  // 真实上证锚点 → 缺口线性插值
  const anchors = Object.keys(shMap).filter(d => d >= days[0] && d <= days[days.length - 1]).sort();
  function shForDate(d) {
    if (shMap[d] != null) return shMap[d];
    if (!anchors.length) return null;
    const first = anchors[0], last = anchors[anchors.length - 1];
    if (d < first || d > last) return null;   // 超出真实数据范围，不估算（避免虚假扁平线）
    let lo = null, hi = null;
    for (const a of anchors) { if (a <= d) lo = a; if (a >= d && hi == null) hi = a; }
    if (lo && hi && lo !== hi) {
      const f = (new Date(d) - new Date(lo)) / (new Date(hi) - new Date(lo));
      return +(shMap[lo] + (shMap[hi] - shMap[lo]) * f).toFixed(2);
    }
    return shMap[lo != null ? lo : hi];
  }
  // 生成空单示例模板（清晰标注，待替换）
  let zh = 130000, ot = 90000;
  const recs = [];
  for (const d of days) {
    zh = Math.max(80000, Math.min(180000, zh + Math.round(Math.random() * 8000 - 3500)));
    ot = Math.max(60000, Math.min(130000, ot + Math.round(Math.random() * 6000 - 3000)));
    const zShort = zh, zLong = zh + Math.round(Math.random() * 20000 + 10000);
    const oShort = ot, oLong = ot + Math.round(Math.random() * 15000 + 8000);
    const pos = {};
    pos[insts[0]] = { long: zLong, short: zShort };
    if (insts[1]) pos[insts[1]] = { long: oLong, short: oShort };
    recs.push({ date: d, source_url: "https://xueqiu.com/u/2411215032", note: "自动填充·空单为示例", positions: pos, sh_index: shForDate(d) });
  }
  const map = {};
  for (const r of lastIF.records) map[r.date] = r;
  for (const r of recs) map[r.date] = r;
  lastIF.records = Object.values(map).sort((a, b) => a.date < b.date ? -1 : 1);
  await ifPersist();
}

function ifTableHtml(recs, insts) {
  // 先按时间升序预计算每个机构每日的净空单水平与日变化，再倒序展示
  const asc = recs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const netsAsc = {}, changesAsc = {};
  insts.forEach(n => {
    netsAsc[n] = asc.map(r => ifInstNet(r, n));
    changesAsc[n] = asc.map((r, idx) => ifInstChange(r, n, idx > 0 ? netsAsc[n][idx - 1] : null));
  });
  const dateIdx = {}; asc.forEach((r, i) => dateIdx[r.date] = i);
  const desc = asc.slice().reverse();
  const hasPositions = asc.some(r => {
    const pos = r.positions || {};
    return insts.some(n => { const p = pos[n] || {}; return p.long != null || p.short != null; });
  });
  let h = `<div style="overflow-x:auto"><table class="if-table"><thead><tr><th rowspan="2">日期</th>`;
  for (const n of insts) h += `<th class="grp" colspan="${hasPositions ? 4 : 2}">${esc(n)}</th>`;
  h += `<th rowspan="2">上证指数</th><th rowspan="2">操作</th></tr><tr>`;
  for (const n of insts) {
    h += `<th>净空单水平</th><th>日增减</th>`;
    if (hasPositions) h += `<th>多单</th><th>空单</th>`;
  }
  h += `</tr></thead><tbody>`;
  desc.forEach(r => {
    const idx = dateIdx[r.date];
    h += `<tr><td>${r.date}${r.note ? ` <span class="b-gray" style="font-size:11px">${esc(r.note)}</span>` : ""}</td>`;
    insts.forEach(n => {
      const p = (r.positions || {})[n] || {};
      const net = netsAsc[n][idx];
      const delta = changesAsc[n][idx];
      const dCls = delta == null ? "" : (delta >= 0 ? "if-delta-pos" : "if-delta-neg");
      const netCls = net == null ? "" : (net >= 0 ? "if-net-pos" : "if-net-neg");
      h += `<td class="${netCls}">${net != null ? net.toLocaleString() : "—"}</td>`;
      h += `<td class="${dCls}">${delta == null ? "—" : (delta > 0 ? "+" : "") + delta.toLocaleString()}</td>`;
      if (hasPositions) {
        h += `<td>${p.long != null ? p.long : "—"}</td><td>${p.short != null ? p.short : "—"}</td>`;
      }
    });
    h += `<td>${r.sh_index != null ? r.sh_index.toFixed(2) : "—"}</td>`;
    h += `<td><a class="if-tbl-link" href="${esc(r.source_url || "#")}" target="_blank" ${r.source_url ? "" : "style='visibility:hidden'"}>原文</a></td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

function ifRenderChart(recs, insts, mode) {
  mode = mode || ifChartMode || "cumulative";
  const isChange = mode === "change";
  const W = 920, H = 320, padL = 66, padR = 66, padT = 22, padB = 46;
  const xs = recs.map(r => r.date);
  // 准备序列
  const series = {};
  insts.forEach(n => {
    series[n] = recs.map((r, idx) => {
      if (isChange) {
        const prev = idx > 0 ? ifInstNet(recs[idx - 1], n) : null;
        return ifInstChange(r, n, prev);
      }
      return ifInstNet(r, n);
    });
  });
  const shSeries = recs.map(r => r.sh_index != null ? r.sh_index : null);
  let leftVals = [];
  insts.forEach(n => series[n].forEach(v => { if (v != null) leftVals.push(v); }));
  if (!leftVals.length) return `<div class="empty">净空单数据不足，无法绘图（请先等待监控自动抓取或手动录入）</div>`;
  const lMin = Math.min(...leftVals), lMax = Math.max(...leftVals), lSpan = (lMax - lMin) || 1;
  const lLo = lMin - lSpan * 0.12, lHi = lMax + lSpan * 0.12;
  const shVals = shSeries.filter(v => v != null);
  let rLo, rHi;
  if (shVals.length) { const sMin = Math.min(...shVals), sMax = Math.max(...shVals), sSpan = (sMax - sMin) || 20; rLo = sMin - sSpan * 0.4; rHi = sMax + sSpan * 0.4; }
  else { rLo = 0; rHi = 1; }
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const X = i => padL + (xs.length <= 1 ? plotW / 2 : i * plotW / (xs.length - 1));
  const YL = v => padT + plotH - (v - lLo) / (lHi - lLo) * plotH;
  const YR = v => padT + plotH - (v - rLo) / (rHi - rLo) * plotH;
  const leftLabel = isChange ? "净空单日增减(手)" : "净空单水平(手)";
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="机构净空单与上证指数趋势">`;
  // 网格 + 左右轴刻度
  for (let g = 0; g <= 4; g++) {
    const y = padT + plotH * g / 4;
    const lVal = lHi - (lHi - lLo) * g / 4;
    const rVal = rHi - (rHi - rLo) * g / 4;
    s += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#ebedf0"/>`;
    s += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5a6b85">${Math.round(lVal).toLocaleString()}</text>`;
    if (shVals.length) s += `<text x="${W - padR + 8}" y="${y + 4}" text-anchor="start" font-size="11" fill="#f5a623">${rVal.toFixed(0)}</text>`;
  }
  s += `<text x="${padL - 8}" y="${padT - 8}" text-anchor="end" font-size="11" fill="#5a6b85">${leftLabel}</text>`;
  if (shVals.length) s += `<text x="${W - padR + 8}" y="${padT - 8}" text-anchor="start" font-size="11" fill="#f5a623">上证指数</text>`;
  // 每日增减视图：横向 0 轴参考线
  if (isChange && lLo <= 0 && 0 <= lHi) {
    const y0 = YL(0);
    s += `<line x1="${padL}" y1="${y0}" x2="${W - padR}" y2="${y0}" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  // x 轴标签
  const step = Math.max(1, Math.ceil(xs.length / 7));
  xs.forEach((d, i) => {
    if (i % step === 0 || i === xs.length - 1)
      s += `<text x="${X(i)}" y="${H - padB + 18}" text-anchor="middle" font-size="10" fill="#8a94a6">${d.slice(5)}</text>`;
  });
  // 机构净空单（左轴）
  insts.forEach((n, ii) => {
    const col = IF_COLORS[ii % IF_COLORS.length];
    let d = "", started = false;
    series[n].forEach((v, i) => {
      if (v == null) { started = false; return; }
      const x = X(i), y = YL(v);
      d += (started ? ` L${x},${y}` : `M${x},${y}`); started = true;
    });
    if (d) s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    series[n].forEach((v, i) => { if (v == null) return; s += `<circle cx="${X(i)}" cy="${YL(v)}" r="3" fill="${col}"/>`; });
  });
  // 上证指数（右轴，橙色）
  if (shVals.length) {
    let d = "", started = false;
    shSeries.forEach((v, i) => {
      if (v == null) { started = false; return; }
      const x = X(i), y = YR(v);
      d += (started ? ` L${x},${y}` : `M${x},${y}`); started = true;
    });
    s += `<path d="${d}" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-dasharray="6 3"/>`;
    shSeries.forEach((v, i) => { if (v == null) return; s += `<circle cx="${X(i)}" cy="${YR(v)}" r="3" fill="#f5a623"/>`; });
  }
  s += `</svg>`;
  return s;
}

function ifAnalyze(recs, insts) {
  const nets = {};
  insts.forEach(n => nets[n] = recs.map(r => ifInstNet(r, n)).filter(v => v != null));
  let h = "";
  insts.forEach((n, ii) => {
    const net = nets[n];
    if (!net.length) { h += `<div class="ana-item"><div class="t">${esc(n)}</div>数据不足</div>`; return; }
    const last = net[net.length - 1];
    const prev = net.length > 1 ? net[net.length - 2] : null;
    const first = net[0];
    const dDaily = prev != null ? (last - prev) : null;
    const dMonth = last - first;
    const weekAgo = net.length > 5 ? net[net.length - 6] : first;
    const dWeek = last - weekAgo;
    const col = IF_COLORS[ii % IF_COLORS.length];
    const dir = v => v == null ? "—" : (v > 0 ? "偏多 🔴" : v < 0 ? "偏空 🟢" : "持平");
    const cls = v => v == null ? "" : (v > 0 ? "if-delta-pos" : "if-delta-neg");
    const fmt = v => v == null ? "—" : ((v > 0 ? "+" : "") + v.toLocaleString());
    h += `<div class="ana-item">
      <div class="t" style="color:${col}">${esc(n)}</div>
      <div>最新净持仓：<b class="${last >= 0 ? 'if-net-pos' : 'if-net-neg'}">${last.toLocaleString()} 手</b>（净 = 多单 − 空单）</div>
      <div>较前一日：<b class="${cls(dDaily)}">${fmt(dDaily)} 手</b> → 短期${dir(dDaily)}</div>
      <div>近一周(≈5 交易日)：<b class="${cls(dWeek)}">${fmt(dWeek)} 手</b></div>
      <div>近 30 日变化：<b class="${cls(dMonth)}">${fmt(dMonth)} 手</b> → 中期${dir(dMonth)}</div>
    </div>`;
  });
  if (insts.length >= 2) {
    const a = nets[insts[0]], b = nets[insts[1]];
    if (a.length && b.length) {
      const da = a[a.length - 1] - (a.length > 1 ? a[a.length - 2] : a[0]);
      const db = b[b.length - 1] - (b.length > 1 ? b[b.length - 2] : b[0]);
      let sig;
      if (da > 0 && db > 0) sig = "两大机构净持仓同步增加 → 机构整体偏多信号 🔴";
      else if (da < 0 && db < 0) sig = "两大机构净持仓同步减少 → 机构整体偏空信号 🟢";
      else if (da > 0 && db < 0) sig = "中信加多、其他机构减多 → 信号分歧，建议观望";
      else if (da < 0 && db > 0) sig = "中信减多、其他机构加多 → 信号分歧，建议观望";
      else sig = "方向不明显，等待更明确信号";
      h += `<div class="ana-item" style="background:#eef4ff;border-color:#cfe0ff">
        <div class="t" style="color:var(--accent)">🧭 综合信号</div>
        <div>${sig}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">说明：净持仓 = 多单 − 空单；中信期货作为重要做市/配置席位，其净多增加常被视为偏多信号，净空增加偏空。本分析仅基于你录入的数据自动计算，<b>仅供跟踪参考，不构成投资建议</b>。</div>
      </div>`;
    }
  }
  return h;
}

function renderLineChart(series, opts) {
  opts = opts || {};
  const W = opts.width || 460, H = opts.height || 180;
  const padL = 48, padR = 12, padT = 12, padB = 28;
  const colors = opts.colors || [opts.color || "#f0413e"];
  const arr = Array.isArray(series) ? series : [series];
  if (!arr.length) return `<div class="empty">无数据</div>`;

  const dateSet = new Set();
  arr.forEach(s => (s.values || []).forEach(v => dateSet.add(v.date)));
  const xs = Array.from(dateSet).sort();
  const rows = xs.map(d => {
    const row = { date: d };
    arr.forEach(s => {
      const v = (s.values || []).find(x => x.date === d);
      row[s.key] = v ? v.value : null;
    });
    return row;
  });

  let all = [];
  arr.forEach(s => (s.values || []).forEach(v => all.push(v.value)));
  if (!all.length) return `<div class="empty">数据不足</div>`;
  let min = Math.min(...all), max = Math.max(...all);
  const span = (max - min) || Math.abs(max * 0.1) || 1;
  min = min - span * 0.12;
  max = max + span * 0.12;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const X = i => padL + (xs.length <= 1 ? plotW / 2 : i * plotW / (xs.length - 1));
  const Y = v => padT + plotH - (v - min) / (max - min) * plotH;

  const fmtY = v => {
    if (opts.yFormat === "pct") return v.toFixed(2);
    if (opts.yFormat === "rate") return v.toFixed(4);
    if (opts.yFormat === "int") return Math.round(v).toLocaleString();
    if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + "万";
    if (Math.abs(v) >= 1) return v.toFixed(2);
    return v.toFixed(4);
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * g / 4, y = Y(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#ebedf0"/>`;
    svg += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8a94a6">${fmtY(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(xs.length / 6));
  xs.forEach((d, i) => {
    if (i % step === 0 || i === xs.length - 1)
      svg += `<text x="${X(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="9" fill="#8a94a6">${d.slice(5)}</text>`;
  });

  arr.forEach((s, si) => {
    const col = colors[si % colors.length];
    let d = "", started = false;
    rows.forEach((r, i) => {
      const v = r[s.key];
      if (v == null) { started = false; return; }
      const x = X(i), y = Y(v);
      d += (started ? ` L${x},${y}` : `M${x},${y}`); started = true;
    });
    if (d) svg += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
    rows.forEach((r, i) => {
      const v = r[s.key];
      if (v != null) svg += `<circle cx="${X(i)}" cy="${Y(v)}" r="2" fill="${col}"/>`;
    });
  });
  svg += `</svg>`;
  return svg;
}

// ============================ 国家队宽基ETF增减持 ============================
const NTF_COLORS = ["#f0413e", "#1e8fff", "#00a854", "#ff7c1e", "#7b61ff", "#13c2c2"];
function renderNtfChart(dates, cats, series, mode) {
  const W = 680, H = 250, padL = 54, padR = 14, padT = 14, padB = 30;
  if (!dates || !dates.length) return `<div class="empty">无数据</div>`;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const X = i => padL + (dates.length <= 1 ? plotW / 2 : i * plotW / (dates.length - 1));
  const fmtY = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(2) + "千" : v.toFixed(0);

  if (mode === "net") {
    // 每日净申购金额（合计，亿元）：柱图，正=净申购(增持,红) 负=净赎回(减持,绿)
    const totals = dates.map((d, i) => {
      let s = 0, cnt = 0;
      cats.forEach(c => { const v = series[c] && series[c].net[i]; if (v != null) { s += v; cnt++; } });
      return cnt ? s : null;
    });
    const vals = totals.filter(v => v != null);
    if (!vals.length) return `<div class="empty">无数据</div>`;
    const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
    const span = (max - min) || 1;
    const Y = v => padT + plotH - (v - min) / span * plotH;
    const bw = Math.max(1, plotW / dates.length * 0.62);
    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
    for (let g = 0; g <= 4; g++) {
      const v = min + span * g / 4, y = Y(v);
      svg += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#ebedf0"/>`;
      svg += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8a94a6">${fmtY(v)}</text>`;
    }
    dates.forEach((d, i) => {
      const v = totals[i]; if (v == null) return;
      const x = X(i) - bw / 2, y0 = Y(0), y1 = Y(v);
      const top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
      svg += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${v >= 0 ? "#f0413e" : "#00a854"}" opacity="0.82"/>`;
    });
    const step = Math.max(1, Math.ceil(dates.length / 7));
    dates.forEach((d, i) => { if (i % step === 0 || i === dates.length - 1) svg += `<text x="${X(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="9" fill="#8a94a6">${d.slice(5)}</text>`; });
    svg += `</svg>`;
    return svg;
  }
  // level：持仓金额（亿元），每类别一条线
  let all = [];
  cats.forEach(c => (series[c] && series[c].level || []).forEach(v => { if (v != null) all.push(v); }));
  if (!all.length) return `<div class="empty">无数据</div>`;
  let min = Math.min(...all), max = Math.max(...all);
  const span = (max - min) || Math.abs(max * 0.1) || 1;
  min -= span * 0.1; max += span * 0.1;
  const Y = v => padT + plotH - (v - min) / (max - min) * plotH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * g / 4, y = Y(v);

  dates.forEach((d, i) => { if (i % step === 0 || i === dates.length - 1) svg += `<text x="${X(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="9" fill="#8a94a6">${d.slice(5)}</text>`; });
  cats.forEach((c, ci) => {

function renderIntraChart(idxs) {
  const sel = idxs.filter(e => intraSelected.has(e.key));
  if (!sel.length) return `<div class="empty">点击上方指数按钮选择要展示的指数</div>`;
  const tset = new Set();
  sel.forEach(e => e.points.forEach(p => tset.add(p[0])));
  const ts = [...tset].sort();
  const W = 900, H = 280, padL = 50, padR = 64, padT = 14, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  let lo = Infinity, hi = -Infinity;
  const series = sel.map(e => {
    const base = e.points[0][1];
    const m = {};
    e.points.forEach(p => { const v = (p[1] / base - 1) * 100; m[p[0]] = v; });
    return { name: e.name, vals: ts.map(t => m[t] != null ? m[t] : null), last: null };
  });
  series.forEach(s => s.vals.forEach(v => { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } }));
  if (lo === Infinity) return `<div class="empty">暂无分时数据（非交易时段或接口异常）</div>`;
  const padv = (hi - lo) * 0.1 || 0.2; lo -= padv; hi += padv;
  const X = i => padL + (ts.length <= 1 ? plotW / 2 : i * plotW / (ts.length - 1));
  const Y = v => padT + plotH - (v - lo) / (hi - lo) * plotH;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  for (let g = 0; g <= 4; g++) {
    const v = lo + (hi - lo) * g / 4, y = Y(v);
    s += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#ebedf0"/>`;
    s += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8a94a6">${v.toFixed(2)}%</text>`;
  }
  if (0 >= lo && 0 <= hi) s += `<line x1="${padL}" y1="${Y(0)}" x2="${W - padR}" y2="${Y(0)}" stroke="#f5a623" stroke-width="1" stroke-dasharray="6 3"/>`;
  const ticks = ["0930", "1000", "1030", "1100", "1130", "1300", "1330", "1400", "1430", "1500"];
  ts.forEach((t, i) => { if (ticks.includes(t)) s += `<text x="${X(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="9" fill="#8a94a6">${t.slice(0, 2)}:${t.slice(2)}</text>`; });
  const ends = [];
  series.forEach((sr, k) => {
    const color = IT_COLORS[k % IT_COLORS.length];
    let path = "", started = false, lastI = -1, lastV = null;
    sr.vals.forEach((v, i) => {
      if (v == null) { started = false; return; }
      path += (started ? " L" : " M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
      started = true; lastI = i; lastV = v;
    });
    if (!path) return;
    s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    if (lastI >= 0) ends.push({ y: Y(lastV), label: `${sr.name} ${lastV >= 0 ? "+" : ""}${lastV.toFixed(2)}%`, color });
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => {
    if (i > 0 && e.y - ends[i - 1].y < 11) e.y = ends[i - 1].y + 11;
    s += `<text x="${W - padR + 6}" y="${e.y + 3}" font-size="9" fill="${e.color}">${e.label}</text>`;
  });
  s += `</svg>`;
  return s;
}

function indexTrendSeries(idxs) {
  const sel = idxs.filter(e => idxSelected.has(e.key) && e.dates && e.dates.length);
  if (!sel.length) return null;
  const dateSet = new Set();
  sel.forEach(e => e.dates.forEach(d => dateSet.add(d)));
  const ds = [...dateSet].sort().slice(-idxRange);
  const startD = ds[0];
  const series = sel.map(e => {
    const m = {};
    e.dates.forEach((d, i) => m[d] = e.closes[i]);
    let base = null;
    for (let i = 0; i < e.dates.length; i++) { if (e.dates[i] >= startD) { base = e.closes[i]; break; } }
    if (base == null) base = e.closes[e.dates.length - 1];
    return { name: e.name, vals: ds.map(d => m[d] != null ? m[d] / base * 100 : null) };
  });
  return { ds, series };
}

  const step = Math.max(1, Math.ceil(ds.length / 8));
  ds.forEach((d, i) => { if (i % step === 0 || i === ds.length - 1) s += `<text x="${X(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="9" fill="#8a94a6">${d.slice(5)}</text>`; });
  sel.forEach((e, k) => {
    const vals = e.share.slice(-n), color = IT_COLORS[k % IT_COLORS.length];
    let path = "", started = false, lastI = -1, lastV = null;
    vals.forEach((v, i) => {
      if (v == null) { started = false; return; }
      path += (started ? " L" : " M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
      started = true; lastI = i; lastV = v;
    });
    s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.7"/>`;
    if (lastI >= 0) s += `<text x="${Math.min(X(lastI) + 4, W - 36)}" y="${Y(lastV) + 3}" font-size="9" fill="${color}">${lastV.toFixed(1)}</text>`;
  });
  s += `</svg>`;
  return s;
}

function renderShareTable(dates, inds) {
  const n = dates.length;
  if (!n) return "";
  const prevIdx = Math.max(0, n - 21);
  const rows = inds.slice().sort((a, b) => (b.share[n - 1] || 0) - (a.share[n - 1] || 0));
  let h = `<div class="section-label">📊 行业成交占比排行（${dates[n - 1]}，对比 ${dates[prevIdx]}）</div>`;
  h += `<div class="if-wrap"><table class="if-table"><thead><tr><th>行业</th><th>分类</th><th>最新占比</th><th>成交额(亿)</th><th>20日占比变化</th></tr></thead><tbody>`;
  rows.forEach(e => {
    const cur = e.share[n - 1], prev = e.share[prevIdx];
    const d = (cur != null && prev != null) ? cur - prev : null;
    const dHtml = d == null ? "—" : `<span style="color:${d >= 0 ? "#f0413e" : "#00a854"};font-weight:600">${d >= 0 ? "+" : ""}${d.toFixed(2)}pp</span>`;
    h += `<tr><td>${e.focus ? "★ " : ""}${esc(e.name)}</td><td>${esc(e.level)}</td><td>${cur == null ? "—" : cur.toFixed(2) + "%"}</td><td>${e.amount[n - 1] == null ? "—" : Math.round(e.amount[n - 1]).toLocaleString()}</td><td>${dHtml}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

function renderMacro(data) {
  const root = document.getElementById("content");
  if (intradayTimer) { clearInterval(intradayTimer); intradayTimer = null; }
  if (!data || !data.series) {
    root.innerHTML = `<div class="empty">暂无资金面数据，请先运行 <code>python a_share_collector.py</code></div>`;
    return;
  }
  const byKey = {};
  data.series.forEach(s => byKey[s.key] = s);
  const latest = s => (s && s.values && s.values.length) ? s.values[s.values.length - 1].value : null;
  const card = (title, v, unit, chart, legend) => `
    <div class="macro-card">
      <div class="macro-card-head">
        <span class="macro-card-title">${esc(title)}</span>
        <span class="macro-card-latest">最新:<b>${v == null ? "—" : v.toLocaleString()}</b><span class="macro-card-unit">${esc(unit)}</span></span>
      </div>
      <div class="macro-chart">${chart}</div>
      ${legend || ""}
    </div>`;

  let html = `<div class="macro-intro">
    本页展示 A 股市场资金面与宏观利率/汇率高频数据。数据来源：东方财富融资融券账户统计、akshare 国债收益率、中国外汇交易中心人民币中间价。
    每日由 <code>a_share_collector.py</code> 自动更新并写入 <code>frontend/data/macro_data.json</code>。
  </div>`;

  html += `<div id="intraday-root"></div>`;
  html += renderIndexTrendSection();
  html += renderIndustryShareSection();

  const has = s => s && s.values && s.values.length;
  html += `<div class="macro-grid">`;
  const rz = byKey["fin_balance"], rq = byKey["loan_balance"];
  if (has(rz)) html += card(rz.label, latest(rz), rz.unit, renderLineChart(rz, { color: "#f0413e" }));
  if (has(rq)) html += card(rq.label, latest(rq), rq.unit, renderLineChart(rq, { color: "#00a854" }));
  const rzb = byKey["fin_buy"], rqs = byKey["loan_sell"];
  if (has(rzb)) html += card(rzb.label, latest(rzb), rzb.unit, renderLineChart(rzb, { color: "#f0413e" }));
  if (has(rqs)) html += card(rqs.label, latest(rqs), rqs.unit, renderLineChart(rqs, { color: "#00a854" }));
  html += `</div>`;

  html += `<div style="height:16px"></div><div class="macro-grid">`;
  const inv = byKey["investor_num"], avg = byKey["avg_guarantee_ratio"];
  if (has(inv)) html += card(inv.label, latest(inv), inv.unit, renderLineChart(inv, { color: "#ff7c1e", yFormat: "int" }));
  if (has(avg)) html += card(avg.label, latest(avg), avg.unit, renderLineChart(avg, { color: "#7b61ff", yFormat: "pct" }));
  const cn = byKey["cn_bond_10y"], us = byKey["us_bond_10y"];
  if (has(cn) || has(us)) {
    const bondTitle = "中美国债收益率对比（10年期）";
    const bondSeries = [cn, us].filter(has);
    html += `<div class="macro-card">
      <div class="macro-card-head"><span class="macro-card-title">${esc(bondTitle)}</span>
        <span class="macro-card-latest">中:<b>${latest(cn) != null ? latest(cn) + "%" : "—"}</b><span style="margin:0 8px"></span>美:<b>${latest(us) != null ? latest(us) + "%" : "—"}</b></span></div>
      <div class="macro-chart">${renderLineChart(bondSeries, { colors: ["#f0413e", "#1e8fff"], yFormat: "pct" })}</div>
      <div class="macro-legend">${bondSeries.map((s, i) => `<span><i style="background:${["#f0413e", "#1e8fff"][i]}"></i>${esc(s.label)}</span>`).join("")}</div>
    </div>`;
  }
  const fx = byKey["usdcny"];
  if (has(fx)) html += card(fx.label, latest(fx), fx.unit, renderLineChart(fx, { color: "#1e8fff", yFormat: "rate" }));
  html += `</div>`;

  html += renderNtfSection();

  root.innerHTML = html;

  // 盘中实时：立即拉一次，之后每 20 秒轮询（仅重绘 intraday-root）
  updateIntraday();
  intradayTimer = setInterval(updateIntraday, 20000);
}

// ============================ 顶层 Tab 与调度 ============================
function syncTopTabs() {
  document.getElementById("tab-bigv").classList.toggle("active", MODE === "bigv");
  document.getElementById("tab-industry").classList.toggle("active", MODE === "industry");
  document.getElementById("tab-ifutures").classList.toggle("active", MODE === "ifutures");
  document.getElementById("tab-macro").classList.toggle("active", MODE === "macro");
  document.getElementById("tab-config").classList.toggle("active", MODE === "config");
}
function render() {
  if (MODE === "bigv") {
    if (lastBigv) renderBigv(lastBigv);
  } else if (MODE === "industry") {
    if (lastInd) renderIndustry(lastInd);
  } else if (MODE === "ifutures") {
    if (lastIF) renderIfutures();
  } else if (MODE === "macro") {
    if (lastMacro) renderMacro(lastMacro);
  } else if (MODE === "config") {
    renderConfig();
  }
}
function switchMode(m) {
  MODE = m;
  syncTopTabs();
  if (m === "config") loadConfig();
  else load();
}
function switchPlatform(key) { activePlatform = key; if (lastBigv) renderBigv(lastBigv); }
function switchUser(uid) { activeUid[activePlatform] = uid; if (lastBigv) renderBigv(lastBigv); }
function switchIndustry(id) { activeIndustry = id; if (lastInd) renderIndustry(lastInd); }

// ============================ 数据加载 ============================
async function load() {
  if (MODE === "config") return;   // 配置页不加载数据
  document.getElementById("loading").style.display = "none";
  try {
    if (MODE === "bigv") {
      const resp = await fetch("data/weibo_monitor_data.json?t=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error(resp.status);
      lastBigv = await resp.json();
      document.getElementById("updated-at").textContent = "最后检测: " + fmtTime(lastBigv.updated_at);
      document.getElementById("new-badge").innerHTML = lastBigv.new_count > 0 ? `<span class="badge-new">+${lastBigv.new_count} 新</span>` : "";
      render();
    } else if (MODE === "ifutures") {
      const sResp = await fetch("/api/index-futures", { cache: "no-store" });
      let store = { institutions: ["中信期货", "其他大机构"], records: [] };
      if (sResp.ok) {
        const j = await sResp.json();
        if (!j.error) store = j;
      }
      lastIF = store;
      let feed = null;
      try {
        const fResp = await fetch("data/if_posts.json?t=" + Date.now(), { cache: "no-store" });
        if (fResp.ok) feed = await fResp.json();
      } catch (e) {}
      lastIF.feed = feed;
      const up = (feed && feed.updated_at) ? fmtTime(feed.updated_at)
                : (lastIF.records && lastIF.records.length ? ("本地 " + lastIF.records.length + " 条") : "—");
      document.getElementById("updated-at").textContent = "原文采集: " + up;
      document.getElementById("new-badge").innerHTML = "";
      render();
    } else if (MODE === "macro") {
      const resp = await fetch("data/macro_data.json?t=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error(resp.status);
      lastMacro = await resp.json();
      document.getElementById("updated-at").textContent = "最后更新: " + fmtTime(lastMacro.updated_at);
      document.getElementById("new-badge").innerHTML = "";
      try {
        const ntfResp = await fetch("data/national_team_etf.json?t=" + Date.now(), { cache: "no-store" });
        ntfData = ntfResp.ok ? await ntfResp.json() : null;
      } catch (e) { ntfData = null; }
      try {
        const itResp = await fetch("data/industry_turnover.json?t=" + Date.now(), { cache: "no-store" });
        turnoverData = itResp.ok ? await itResp.json() : null;
      } catch (e) { turnoverData = null; }
      try {
        const idxResp = await fetch("data/index_trend.json?t=" + Date.now(), { cache: "no-store" });
        idxTrendData = idxResp.ok ? await idxResp.json() : null;
      } catch (e) { idxTrendData = null; }
      render();
    } else {
      const resp = await fetch("data/industry_data.json?t=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error(resp.status);
      lastInd = await resp.json();
      document.getElementById("updated-at").textContent = "最后检测: " + fmtTime(lastInd.updated_at);
      document.getElementById("new-badge").innerHTML = lastInd.new_count > 0 ? `<span class="badge-new">+${lastInd.new_count} 新</span>` : "";
      render();
    }
  } catch (e) {
    const el = document.getElementById("loading");
    if (el) { el.style.display = "block"; el.textContent = "暂无数据 — 请先运行 python weibo_monitor.py 生成"; }
  }
}
load();
// 启动即读取前台轮询间隔（不影响数据加载），随后启动可配置轮询
fetch("/api/config", { cache: "no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(c => { if (c && c.frontend_poll_interval_sec) { pollIntervalSec = c.frontend_poll_interval_sec; updatePollHint(); } })
  .catch(() => {})
  .finally(() => startPolling());
</script>
